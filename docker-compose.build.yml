version: '3.8'

services:
  ccload:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 版本号：用于静态资源缓存控制
        # - dev（默认）：开发环境，静态资源不缓存
        # - v1.x.x：生产环境，静态资源长缓存
        # 生产构建: VERSION=$(git describe --tags --always) docker-compose -f docker-compose.build.yml build
        VERSION: ${VERSION:-dev}
    image: ccload:local
    container_name: ccload
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。只改左边即可对外换端口，不要改右边
      - "8080:8080"
    # 所有配置统一写在 .env 里（从 .env.docker.example 复制）。
    # 文件不存在时 Compose 直接报错拒绝启动，不会用弱默认密码跑起来。
    env_file:
      - .env
    volumes:
      - ccload_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ccload_data:
    driver: local
