name: Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Test backend
        id: backend
        env:
          CGO_ENABLED: 0
        run: go test -trimpath -tags sonic -json ./internal/... > "$RUNNER_TEMP/backend-tests.jsonl"

      - name: Summarize backend test timings
        if: ${{ !cancelled() && steps.backend.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "backend-tests.jsonl"
          events = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          parallel = {(e.get("Package"), e.get("Test")) for e in events if e["Action"] == "pause"}
          completed = [e for e in events if e["Action"] in ("pass", "fail", "skip") and "Elapsed" in e]
          packages = [e for e in completed if not e.get("Test")]
          tests = [e for e in completed if e.get("Test") and "/" not in e["Test"]]
          serial_tests = [e for e in tests if (e["Package"], e["Test"]) not in parallel]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for title, rows in (("Backend packages", packages), ("Slowest serial top-level tests", serial_tests), ("Slowest top-level tests", tests)):
                  summary.write(f"### {title}\n\n| Package / test | Seconds | Result | Execution |\n| --- | ---: | --- | --- |\n")
                  for event in sorted(rows, key=lambda e: e["Elapsed"], reverse=True)[:20]:
                      name = event["Package"] + (" / " + event["Test"] if event.get("Test") else "")
                      execution = "parallel" if (event.get("Package"), event.get("Test")) in parallel else "serial"
                      if not event.get("Test"):
                          execution = "—"
                      summary.write(f"| {name} | {event['Elapsed']:.3f} | {event['Action']} | {execution} |\n")
                  summary.write("\n")
              summary.write("Top-level durations include their subtests; parallel durations must not be added together. Cached package results are not a fresh timing measurement.\n")
          failed_packages = {e["Package"] for e in events if e["Action"] == "fail" and not e.get("Test")}
          for event in events:
              if event.get("Package") in failed_packages and event.get("Output"):
                  print(event["Output"], end="")
          PY

      - name: Upload backend test events
        if: ${{ !cancelled() && steps.backend.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-events
          path: ${{ runner.temp }}/backend-tests.jsonl
          retention-days: 7

      - name: Build
        run: make build

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}

  # Separate job: installing Node takes ~16s and must not sit on the backend test path.
  web:
    name: Verify web assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Verify web assets
        run: make verify-web

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      # The action's own cache key is immutable within a 7-day window and rotates weekly,
      # forcing a cold analysis (~150s vs ~30s). Keep the analysis cache inside GOCACHE so it
      # rolls forward per commit with the Go build cache and is pruned by save-go-cache.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        env:
          GOLANGCI_LINT_CACHE: ${{ steps.go.outputs.build-cache-path }}/golangci-lint
        with:
          version: v2.13.0
          args: --timeout=10m
          skip-cache: true

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}

  # Warms per-target build caches that release.yml restores for tags on master commits.
  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
        with:
          cache-key: cross-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -tags sonic -trimpath -o "$RUNNER_TEMP/ccload" .

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ccload
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: ccload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccload -d ccload_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Run PostgreSQL integration tests
        env:
          CCLOAD_TEST_POSTGRES_DSN: postgres://ccload:testpass@127.0.0.1:5432/ccload_test?sslmode=disable
        run: go test -tags "sonic postgres_integration" ./internal/storage -run '^TestPostgres$' -count=1

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}
