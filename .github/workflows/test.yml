name: Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Test backend
        env:
          CGO_ENABLED: 0
        run: go test -trimpath -tags sonic ./internal/...

      - name: Verify web assets
        run: make verify-web

      - name: Build
        run: make build

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=10m

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}

  # Warms per-target build caches that release.yml restores for tags on master commits.
  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
        with:
          cache-key: cross-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -tags sonic -trimpath -o "$RUNNER_TEMP/ccload" .

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ccload
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: ccload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccload -d ccload_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Run PostgreSQL integration tests
        env:
          CCLOAD_TEST_POSTGRES_DSN: postgres://ccload:testpass@127.0.0.1:5432/ccload_test?sslmode=disable
        run: go test -tags "sonic postgres_integration" ./internal/storage -run '^TestPostgres$' -count=1

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outcome == 'success' }}
        uses: ./.github/actions/save-go-cache
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}
