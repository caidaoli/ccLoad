name: Set up Go
description: Cache dependencies separately from the build results updated by each job.

runs:
  using: composite
  steps:
    - name: Install Go
      id: go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      id: modules
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-mod-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          go-mod-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

    # Every job must save the full dependency set, including the PostgreSQL job.
    - name: Download Go modules
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: go mod download

    - name: Cache Go build results
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-
