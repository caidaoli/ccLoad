<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title data-i18n="index.title">Claude Code & Codex Proxy 代理服务</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/date-range-selector.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/filter-state.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/searchable-select.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/service-health.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/channel-provider-icons.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/index.js?v=__VERSION__"></script>
</head>
<body class="page-index">
  <div class="app-container">

    <!-- 主内容区域 -->
    <main class="main-content index-main-content">
      <div class="content-area">
        <!-- 页头：时间范围与刷新 -->
        <header class="overview-header mb-4">
          <div class="overview-actions">
            <div class="time-range-container">
              <div id="index-time-range" class="time-range-selector"></div>
            </div>
            <button type="button" id="overview-refresh" class="overview-refresh" data-i18n-title="index.overview.refresh" title="刷新" data-i18n-aria-label="index.overview.refresh" aria-label="刷新">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
          </div>
        </header>

        <!-- 全局指标 -->
        <section class="overview-kpis mb-4 animate-slide-up animate-delay-1">
          <div class="glass-card overview-kpi">
            <span class="overview-kpi-icon overview-kpi-icon--requests" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>
            </span>
            <div class="overview-kpi-body">
              <div class="overview-kpi-label" data-i18n="index.overview.totalRequests">请求总数</div>
              <div class="overview-kpi-value" id="overview-requests">0</div>
            </div>
          </div>
          <div class="glass-card overview-kpi">
            <span class="overview-kpi-icon overview-kpi-icon--success" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            <div class="overview-kpi-body">
              <div class="overview-kpi-label" data-i18n="index.overview.successRate">成功率</div>
              <div class="overview-kpi-value" id="overview-rate">--</div>
              <div class="overview-kpi-sub" id="overview-counts"></div>
            </div>
          </div>
          <div class="glass-card overview-kpi">
            <span class="overview-kpi-icon overview-kpi-icon--cost" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </span>
            <div class="overview-kpi-body">
              <div class="overview-kpi-label" data-i18n="index.overview.totalCost">总费用</div>
              <div class="overview-kpi-value" id="overview-cost">$0</div>
            </div>
          </div>
          <div class="glass-card overview-kpi">
            <span class="overview-kpi-icon overview-kpi-icon--tokens" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            </span>
            <div class="overview-kpi-body">
              <div class="overview-kpi-label" data-i18n="index.overview.outputTokens">输出 Tokens</div>
              <div class="overview-kpi-value" id="overview-output-tokens">0</div>
            </div>
          </div>
        </section>

        <!-- 按客户端入口协议统计：仅列有请求的协议 -->
        <section id="protocol-usage-section" class="mb-4" hidden>
          <div class="glass-card usage-card animate-slide-up animate-delay-1">
            <h2 class="usage-card-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
              <span data-i18n="index.overview.protocolUsage">请求协议用量</span>
            </h2>
            <div class="usage-table-wrap">
              <table class="usage-table">
                <thead>
                  <tr>
                    <th scope="col" data-i18n="index.overview.colProtocol">协议</th>
                    <th scope="col" data-i18n="index.overview.colRequests">请求数</th>
                    <th scope="col" data-i18n="index.overview.colSuccessRate">成功率</th>
                    <th scope="col" data-i18n="index.overview.colCost">费用</th>
                    <th scope="col" data-i18n="index.overview.colInput">输入 Tokens</th>
                    <th scope="col" data-i18n="index.overview.colOutput">输出 Tokens</th>
                    <th scope="col" data-i18n="index.overview.colCacheRead">缓存读取</th>
                    <th scope="col" data-i18n="index.overview.colCacheCreate">缓存创建</th>
                  </tr>
                </thead>
                <tbody id="protocol-usage-body"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- 按渠道认证类型统计：仅列有请求的类型 -->
        <section id="auth-type-section" class="mb-4" hidden>
          <div class="glass-card usage-card animate-slide-up animate-delay-1">
            <h2 class="usage-card-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M10.5 7.6 6.5 16.4"/><path d="m13.5 7.6 4 8.8"/></svg>
              <span data-i18n="index.overview.channelUsage">渠道用量</span>
            </h2>
            <div class="usage-table-wrap">
              <table class="usage-table">
                <thead>
                  <tr>
                    <th scope="col" data-i18n="index.overview.colChannel">渠道</th>
                    <th scope="col" data-i18n="index.overview.colRequests">请求数</th>
                    <th scope="col" data-i18n="index.overview.colSuccessRate">成功率</th>
                    <th scope="col" data-i18n="index.overview.colCost">费用</th>
                    <th scope="col" data-i18n="index.overview.colInput">输入 Tokens</th>
                    <th scope="col" data-i18n="index.overview.colOutput">输出 Tokens</th>
                    <th scope="col" data-i18n="index.overview.colCacheRead">缓存读取</th>
                    <th scope="col" data-i18n="index.overview.colCacheCreate">缓存创建</th>
                  </tr>
                </thead>
                <tbody id="auth-type-usage-body"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- 服务健康监测 -->
        <section class="mb-6">
          <div class="glass-card service-health-card animate-slide-up animate-delay-2" aria-labelledby="service-health-title">
            <div class="service-health-header">
              <div class="service-health-heading">
                <h2 id="service-health-title" class="service-health-title">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                  <span data-i18n="index.health.title">服务健康监测</span>
                </h2>
                <span id="service-health-counts" class="service-health-counts"></span>
              </div>
              <div class="service-health-summary">
                <span id="service-health-period" class="service-health-period">本日</span>
                <span id="service-health-rate" class="service-health-rate" data-state="unknown" aria-live="polite">--</span>
              </div>
            </div>
            <div class="service-health-plot">
              <div
                id="service-health-grid"
                class="service-health-grid"
                role="img"
                aria-busy="true"
                data-i18n-aria-label="index.health.loading"
                aria-label="正在加载服务健康数据"
              ></div>
              <div id="service-health-tooltip" class="service-health-tooltip" role="tooltip" hidden>
                <div id="service-health-tooltip-time" class="service-health-tooltip-time"></div>
                <div class="service-health-tooltip-stats">
                  <span class="service-health-tooltip-success">✓ <strong id="service-health-tooltip-success">0</strong></span>
                  <span class="service-health-tooltip-error">× <strong id="service-health-tooltip-error">0</strong></span>
                  <span id="service-health-tooltip-rate-limited" class="service-health-tooltip-rate-limited" hidden></span>
                  <span id="service-health-tooltip-rate" class="service-health-tooltip-rate">--</span>
                </div>
              </div>
              <div class="service-health-footer">
                <span id="service-health-earlier" class="service-health-edge">--</span>
                <div class="service-health-legend" data-i18n-aria-label="index.health.legendLabel" aria-label="健康状态图例">
                  <span class="service-health-legend-item"><i class="service-health-swatch unknown" aria-hidden="true"></i><span data-i18n="index.health.noRequests">无请求</span></span>
                  <span class="service-health-legend-item"><i class="service-health-swatch critical" aria-hidden="true"></i><span data-i18n="index.health.critical">异常</span></span>
                  <span class="service-health-legend-item"><i class="service-health-swatch warning" aria-hidden="true"></i><span data-i18n="index.health.warning">波动</span></span>
                  <span class="service-health-legend-item"><i class="service-health-swatch healthy" aria-hidden="true"></i><span data-i18n="index.health.healthy">健康</span></span>
                </div>
                <span id="service-health-latest" class="service-health-edge">--</span>
              </div>
            </div>
            <p id="service-health-message" class="service-health-message" role="status" hidden></p>
          </div>
        </section>

      </div>
    </main>
  </div>

</body>
</html>
