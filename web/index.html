<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title data-i18n="index.title">Claude Code & Codex Proxy 代理服务</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/date-range-selector.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/filter-state.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/searchable-select.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/service-health.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/channel-provider-icons.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/index.js?v=__VERSION__"></script>
</head>
<body class="page-index top-layout">
  <div class="app-container">

    <!-- 主内容区域 -->
    <main class="main-content index-main-content">
      <div class="content-area">
        <!-- 页头：时间范围与刷新 -->
        <header class="overview-header mb-4">
          <div class="overview-actions">
            <div class="time-range-container">
              <div id="index-time-range" class="time-range-selector"></div>
            </div>
            <button type="button" id="overview-refresh" class="overview-refresh" data-i18n-title="index.overview.refresh" title="刷新" data-i18n-aria-label="index.overview.refresh" aria-label="刷新">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
          </div>
        </header>

        <!-- 全局指标：迷你趋势取自服务健康同一份分桶数据 -->
        <section class="overview-kpis mb-4">
          <div class="glass-card overview-kpi">
            <div class="overview-kpi-head">
              <span class="overview-kpi-icon overview-kpi-icon--requests" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              </span>
              <span class="overview-kpi-label" data-i18n="index.overview.totalRequests">请求总数</span>
            </div>
            <div class="overview-kpi-main">
              <div class="overview-kpi-value" id="overview-requests">0</div>
              <svg id="overview-requests-spark" class="overview-spark overview-spark--requests" data-metric="requests" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"></svg>
            </div>
            <div class="overview-kpi-sub" id="overview-counts"></div>
          </div>
          <div class="glass-card overview-kpi">
            <div class="overview-kpi-head">
              <span class="overview-kpi-icon overview-kpi-icon--success" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <span class="overview-kpi-label" data-i18n="index.overview.successRate">成功率</span>
            </div>
            <div class="overview-kpi-main">
              <div class="overview-kpi-value" id="overview-rate">--</div>
              <svg id="overview-rate-ring" class="overview-ring" viewBox="0 0 40 40" data-state="unknown" aria-hidden="true">
                <circle class="overview-ring-track" cx="20" cy="20" r="16" pathLength="100"/>
                <circle class="overview-ring-value" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="0 100"/>
              </svg>
            </div>
          </div>
          <div class="glass-card overview-kpi">
            <div class="overview-kpi-head">
              <span class="overview-kpi-icon overview-kpi-icon--tokens" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
              </span>
              <span class="overview-kpi-label" data-i18n="index.overview.totalTokens">Token 用量</span>
            </div>
            <div class="overview-kpi-main">
              <div class="overview-kpi-value" id="overview-tokens">0</div>
              <svg id="overview-tokens-spark" class="overview-spark overview-spark--tokens" data-metric="tokens" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"></svg>
            </div>
            <div class="overview-kpi-sub" id="overview-tokens-detail"></div>
          </div>
          <div class="glass-card overview-kpi">
            <div class="overview-kpi-head">
              <span class="overview-kpi-icon overview-kpi-icon--cache" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
              </span>
              <span class="overview-kpi-label" data-i18n="index.overview.cacheRate">缓存率</span>
            </div>
            <div class="overview-kpi-main">
              <div class="overview-kpi-value" id="overview-cache-rate">--</div>
              <svg id="overview-cache-ring" class="overview-ring overview-ring--cache" viewBox="0 0 40 40" aria-hidden="true">
                <circle class="overview-ring-track" cx="20" cy="20" r="16" pathLength="100"/>
                <circle class="overview-ring-value" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="0 100"/>
              </svg>
            </div>
            <div class="overview-kpi-sub" id="overview-cache-detail"></div>
          </div>
          <div class="glass-card overview-kpi">
            <div class="overview-kpi-head">
              <span class="overview-kpi-icon overview-kpi-icon--cost" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              </span>
              <span class="overview-kpi-label" data-i18n="index.overview.totalCost">总费用</span>
            </div>
            <div class="overview-kpi-main">
              <div class="overview-kpi-value" id="overview-cost">$0</div>
              <svg id="overview-cost-spark" class="overview-spark overview-spark--cost" data-metric="cost" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"></svg>
            </div>
          </div>
          <span id="overview-spark-dot" class="overview-spark-dot" aria-hidden="true" hidden></span>
          <div id="overview-spark-tooltip" class="service-health-tooltip" role="tooltip" hidden>
            <div id="overview-spark-tooltip-time" class="service-health-tooltip-time"></div>
            <strong id="overview-spark-tooltip-value" class="overview-spark-tooltip-value"></strong>
          </div>
        </section>

        <!-- 服务健康监测 -->
        <section class="mb-4">
          <div class="glass-card service-health-card" aria-labelledby="service-health-title">
            <div class="service-health-header">
              <div class="service-health-heading">
                <h2 id="service-health-title" class="service-health-title">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                  <span data-i18n="index.health.title">服务健康监测</span>
                </h2>
                <span id="service-health-counts" class="service-health-counts"></span>
              </div>
              <div class="service-health-summary">
                <span id="service-health-period" class="service-health-period">本日</span>
                <span id="service-health-rate" class="service-health-rate" data-state="unknown" aria-live="polite">--</span>
              </div>
            </div>
            <div class="service-health-plot">
              <div
                id="service-health-grid"
                class="service-health-grid"
                role="img"
                aria-busy="true"
                data-i18n-aria-label="index.health.loading"
                aria-label="正在加载服务健康数据"
              ></div>
              <div id="service-health-tooltip" class="service-health-tooltip" role="tooltip" hidden>
                <div id="service-health-tooltip-time" class="service-health-tooltip-time"></div>
                <div id="service-health-tooltip-pending" class="service-health-tooltip-pending" hidden></div>
                <div id="service-health-tooltip-stats" class="service-health-tooltip-stats">
                  <span class="service-health-tooltip-success">✓ <strong id="service-health-tooltip-success">0</strong></span>
                  <span class="service-health-tooltip-error">× <strong id="service-health-tooltip-error">0</strong></span>
                  <span id="service-health-tooltip-rate-limited" class="service-health-tooltip-rate-limited" hidden></span>
                  <span id="service-health-tooltip-rate" class="service-health-tooltip-rate">--</span>
                </div>
              </div>
            </div>
            <p id="service-health-message" class="service-health-message" role="status" hidden></p>
          </div>
        </section>

        <!-- Token 构成与用量来源排行 -->
        <section class="overview-breakdown mb-4">
          <div class="glass-card usage-card token-mix-card">
            <h2 class="usage-card-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
              <span data-i18n="index.tokenMix.title">Token 构成</span>
            </h2>
            <div id="token-mix" class="token-mix">
              <div class="token-mix-chart">
                <svg id="token-mix-donut" class="token-mix-donut" viewBox="0 0 42 42" aria-hidden="true">
                  <circle class="token-mix-track" cx="21" cy="21" r="16" pathLength="100"/>
                  <g id="token-mix-segments"></g>
                </svg>
                <div class="token-mix-center">
                  <strong id="token-mix-total">0</strong>
                  <span id="token-mix-caption" data-i18n="index.tokenMix.total">总用量</span>
                  <span id="token-mix-detail" class="token-mix-detail" hidden></span>
                </div>
              </div>
              <ul id="token-mix-legend" class="token-mix-legend"></ul>
            </div>
          </div>

          <div class="glass-card usage-card usage-rank-card">
            <div class="usage-card-header">
              <h2 class="usage-card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 16h3"/><path d="M7 11h8"/><path d="M7 6h12"/></svg>
                <span data-i18n="index.rank.title">用量来源</span>
              </h2>
              <div class="toggle-group" id="usage-rank-metric" role="group" data-i18n-aria-label="index.rank.metric" aria-label="排行指标">
                <button type="button" class="toggle-btn active" data-metric="requests" aria-pressed="true" data-i18n="index.rank.requests">请求数</button>
                <button type="button" class="toggle-btn" data-metric="tokens" aria-pressed="false" data-i18n="index.rank.tokens">Token 用量</button>
                <button type="button" class="toggle-btn" data-metric="cost" aria-pressed="false" data-i18n="index.rank.cost">费用</button>
              </div>
            </div>
            <div class="usage-rank-grid">
              <section class="usage-rank" aria-labelledby="usage-rank-model-title">
                <h3 id="usage-rank-model-title" class="usage-rank-title" data-i18n="index.rank.model">模型</h3>
                <ol id="usage-rank-model" class="usage-rank-list"></ol>
              </section>
              <section class="usage-rank" aria-labelledby="usage-rank-channel-title">
                <h3 id="usage-rank-channel-title" class="usage-rank-title" data-i18n="index.rank.channel">渠道</h3>
                <ol id="usage-rank-channel" class="usage-rank-list"></ol>
              </section>
              <section class="usage-rank" aria-labelledby="usage-rank-protocol-title">
                <h3 id="usage-rank-protocol-title" class="usage-rank-title" data-i18n="index.rank.protocol">请求协议</h3>
                <ol id="usage-rank-protocol" class="usage-rank-list"></ol>
              </section>
              <section class="usage-rank" aria-labelledby="usage-rank-auth-type-title">
                <h3 id="usage-rank-auth-type-title" class="usage-rank-title" data-i18n="index.rank.authType">渠道类型</h3>
                <ol id="usage-rank-auth-type" class="usage-rank-list"></ol>
              </section>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

</body>
</html>
