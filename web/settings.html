<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <link rel="apple-touch-icon" href="/web/apple-touch-icon.png">
  <link rel="manifest" href="/web/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <title data-i18n="settings.title">系统设置 - Claude Code & Codex Proxy</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <script defer src="/web/assets/locales/zh-CN.js?v=__VERSION__"></script>
  <script defer src="/web/assets/locales/en.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/i18n.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/template-engine.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/web-auth.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/ui.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/settings.js?v=__VERSION__"></script>
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <div class="content-area">
        <section id="settings-group-nav-section" class="mt-2 mb-2 settings-group-nav-section" hidden>
          <div class="time-range-container settings-group-nav-container">
            <div id="settings-group-nav" class="time-range-selector settings-group-nav">
              <!-- 动态填充：分组快捷跳转 -->
            </div>
          </div>
        </section>

        <section class="glass-card mb-6">
          <div class="table-container settings-table-container mobile-card-table-container">
            <table class="modern-table settings-table mobile-card-table">
              <tbody id="settings-tbody">
                <!-- 动态填充 -->
              </tbody>
            </table>
          </div>
          <div class="settings-save-actions">
            <button id="runtime-metrics-btn" type="button" class="btn btn-secondary settings-runtime-metrics-btn" data-i18n="settings.runtimeMetrics.button">
              运行状态
            </button>
            <button id="save-all-btn" class="btn btn-primary settings-save-btn" data-i18n="settings.saveAll">
              保存所有更改
            </button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 进程运行指标 -->
  <div id="runtimeMetricsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="runtimeMetricsTitle" aria-hidden="true">
    <div class="modal-content runtime-metrics-modal">
      <div class="modal-header runtime-metrics-modal-header">
        <div>
          <h2 id="runtimeMetricsTitle" class="modal-title" data-i18n="settings.runtimeMetrics.title">运行状态</h2>
          <p class="modal-description" data-i18n="settings.runtimeMetrics.description">当前进程中的 Responses WebSocket 资源占用</p>
        </div>
        <button type="button" class="close-btn" data-action="close-runtime-metrics" data-i18n-aria-label="common.close" aria-label="关闭">&times;</button>
      </div>

      <div id="runtime-metrics-content" class="runtime-metrics-content" aria-live="polite"></div>

      <div class="runtime-metrics-modal-footer">
        <span id="runtime-metrics-updated-at" class="runtime-metrics-updated-at"></span>
        <div class="runtime-metrics-footer-actions">
          <button id="refresh-runtime-metrics-btn" type="button" class="btn btn-secondary" data-i18n="settings.runtimeMetrics.refresh">刷新</button>
          <button type="button" class="btn btn-primary" data-action="close-runtime-metrics" data-i18n="common.close">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置行模板 -->
  <template id="tpl-setting-row">
    <tr class="mobile-card-row setting-data-row" data-key="{{key}}">
      <td class="setting-col-description" data-mobile-label="{{mobileLabelDescription}}">{{description}}</td>
      <td class="setting-col-value" data-mobile-label="{{mobileLabelValue}}">{{{inputHtml}}}</td>
      <td class="setting-col-actions" data-mobile-label="{{mobileLabelActions}}">
        <button class="btn-icon setting-reset-btn" data-key="{{key}}" data-i18n-title="settings.resetToDefault" title="重置为默认值">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </td>
    </tr>
  </template>

  <!-- 分组标题行模板 -->
  <template id="tpl-setting-group-row">
    <tr class="setting-group-row" id="settings-group-{{groupId}}" data-group="{{groupId}}">
      <td colspan="3" class="setting-group-cell">
        {{groupName}}
      </td>
    </tr>
  </template>

</body>
</html>
